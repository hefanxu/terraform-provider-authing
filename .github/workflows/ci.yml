name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Go format, vet, test, race, build and Terraform protocol
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Download dependencies
        run: go mod download
      - name: Terraform plugin protocol smoke (no Authing API)
        run: python3 scripts/protocol_smoke.py
      - name: Sandbox dispatch guard tests (no Authing API)
        run: python3 -m unittest discover -s scripts/acceptance -p test_run_live_case.py
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Race test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...
