name: Authing sandbox acceptance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'READ_ONLY_SANDBOX: one GET plan; DESTRUCTIVE_SANDBOX: one disposable resource lifecycle'
        required: true
        type: string
      test_case:
        description: 'Select exactly one resource for a destructive sandbox test'
        required: true
        default: group
        type: choice
        options:
          - group
          - application
          - namespace
          - user
          - public_account
          - ext_idp
          - webhook
          - organization
          - invitation_policy
          - role
          - resource
          - post
          - invitation_roster
          - data_resource
          - group_member
          - auth_flow_function
          - data_object
          - data_policy
          - tenant
          - invitation_invitee
      test_object_code:
        description: 'Read-only recovery: exact generated incident code only'
        required: false
        type: string

permissions:
  contents: read

jobs:
  read-only-plan:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/management-api-coverage' && inputs.confirm == 'READ_ONLY_SANDBOX' && inputs.test_object_code == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: authing-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install checksum-verified Terraform and verify provider protocol offline
        run: python3 scripts/protocol_smoke.py
      - name: Verify mock read-only request path and guards
        run: go test -count=1 -run '^(TestGuard|TestMockReadOnlyPlan|TestMockFailureSuppressesCredentials)$' ./scripts/acceptance
      - name: Plan one read-only data source against Authing sandbox
        env:
          AUTHING_ACCEPTANCE_CONFIRM: ${{ inputs.confirm }}
          AUTHING_ACCESS_KEY_ID: ${{ secrets.AUTHING_ACCESS_KEY_ID }}
          AUTHING_ACCESS_KEY_SECRET: ${{ secrets.AUTHING_ACCESS_KEY_SECRET }}
          AUTHING_HOST: ${{ vars.AUTHING_HOST }}
        run: go test -count=1 -run '^TestReadOnlyPlan$' ./scripts/acceptance -args -authing-read-only-sandbox

  application-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/management-api-coverage' && inputs.confirm == 'READ_ONLY_SANDBOX' && inputs.test_case == 'application' && (inputs.test_object_code == 'hermesacc-c99546b76631e842' || inputs.test_object_code == 'hermesacc-05aa25aef574a094' || inputs.test_object_code == 'hermesacc-db3c63ade05f10bb' || inputs.test_object_code == 'hermesacc-fe2e944f9929d3d2') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: authing-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify recovery probe offline
        run: go test -count=1 -run '^(TestApplicationRecoveryProbe|TestApplicationRecoveryGuard|TestApplicationDiscoveryUnfiltered)$' ./scripts/acceptance
      - name: Probe exact incident application with GET only
        env:
          ACCEPTANCE_TEST_OBJECT_CODE: ${{ inputs.test_object_code }}
          AUTHING_ACCEPTANCE_CONFIRM: ${{ inputs.confirm }}
          AUTHING_ACCESS_KEY_ID: ${{ secrets.AUTHING_ACCESS_KEY_ID }}
          AUTHING_ACCESS_KEY_SECRET: ${{ secrets.AUTHING_ACCESS_KEY_SECRET }}
          AUTHING_HOST: ${{ vars.AUTHING_HOST }}
        run: go test -count=1 -v -run '^TestReadOnlyApplicationRecovery$' ./scripts/acceptance -args -authing-application-recovery

  namespace-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/management-api-coverage' && inputs.confirm == 'READ_ONLY_SANDBOX' && inputs.test_case == 'namespace' && inputs.test_object_code == 'hermesacc-a69a5cb1b971aa8e' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: authing-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify read-only recovery probe offline
        run: go test -count=1 -run '^(TestNamespaceRecoveryProbeMock|TestNamespaceRecoveryProbeGuard|TestNamespaceRecoveryProbeInventoryFailureIsUnknown|TestNamespaceRecoveryProbeDoesNotConflateFailureWithAbsence)$' ./scripts/acceptance
      - name: Probe exact incident namespace with GET only
        env:
          AUTHING_TEST_OBJECT_CODE: ${{ inputs.test_object_code }}
          AUTHING_ACCEPTANCE_CONFIRM: ${{ inputs.confirm }}
          AUTHING_ACCESS_KEY_ID: ${{ secrets.AUTHING_ACCESS_KEY_ID }}
          AUTHING_ACCESS_KEY_SECRET: ${{ secrets.AUTHING_ACCESS_KEY_SECRET }}
          AUTHING_HOST: ${{ vars.AUTHING_HOST }}
        run: go test -count=1 -v -run '^TestNamespaceRecoveryProbe$' ./scripts/acceptance -args -authing-namespace-recovery-sandbox

  destructive-case:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/management-api-coverage' && inputs.confirm == 'DESTRUCTIVE_SANDBOX' && inputs.test_object_code == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: authing-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install checksum-verified Terraform and verify provider protocol offline
        run: python3 scripts/protocol_smoke.py
      - name: Verify selection, guard, and redacted diagnostics offline
        run: python3 -m unittest discover -s scripts/acceptance -p test_run_live_case.py
      - name: Verify mock Terraform lifecycles offline
        run: go test -count=1 ./scripts/acceptance
      - name: Trace one selected lifecycle in isolated Authing sandbox
        env:
          ACCEPTANCE_TEST_CASE: ${{ inputs.test_case }}
          AUTHING_ACCEPTANCE_CONFIRM: ${{ inputs.confirm }}
          AUTHING_ACCESS_KEY_ID: ${{ secrets.AUTHING_ACCESS_KEY_ID }}
          AUTHING_ACCESS_KEY_SECRET: ${{ secrets.AUTHING_ACCESS_KEY_SECRET }}
          AUTHING_HOST: ${{ vars.AUTHING_HOST }}
        run: python3 scripts/acceptance/run_live_case.py

  namespace-recovery-cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/management-api-coverage' && inputs.confirm == 'DESTRUCTIVE_SANDBOX' && inputs.test_case == 'namespace' && inputs.test_object_code == 'hermesacc-a69a5cb1b971aa8e' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: authing-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify ownership and cleanup refusal offline
        run: go test -count=1 -run '^(TestNamespaceCleanupGuard|TestNamespaceRecoveryCleanupMockSuccess|TestNamespaceCleanupRefusesAnyGlobalPolicyOrUnknownInventory|TestNamespaceResourceInventoryAllowsOnlyCompleteEmptyRuntimeShape)$' ./scripts/acceptance
      - name: Delete exact test-owned namespace only after fresh empty inventories
        env:
          AUTHING_TEST_OBJECT_CODE: ${{ inputs.test_object_code }}
          AUTHING_ACCEPTANCE_CONFIRM: ${{ inputs.confirm }}
          AUTHING_ACCESS_KEY_ID: ${{ secrets.AUTHING_ACCESS_KEY_ID }}
          AUTHING_ACCESS_KEY_SECRET: ${{ secrets.AUTHING_ACCESS_KEY_SECRET }}
          AUTHING_HOST: ${{ vars.AUTHING_HOST }}
        run: go test -count=1 -v -run '^TestNamespaceRecoveryCleanup$' ./scripts/acceptance -args -authing-namespace-cleanup-sandbox
